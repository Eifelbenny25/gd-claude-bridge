name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-2022  # windows-latest hat VS 18, dessen STL braucht Clang 22
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          # Feste Geode-Version fuer GD 2.2081 ("latest" nimmt sonst die 6.0-Alpha)
          sdk: v5.11.2

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: claude-bridge-mod
          path: ${{ steps.build.outputs.build-output }}
